<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog — agustinst.code</title>
  <meta name="description" content="Artículos sobre desarrollo de software, UX/UI, automatización y productos digitales por Agustín Stoppello.">
  <link rel="icon" href="imag/IMG_0259.PNG" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .blog-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 22px;
    }
    .blog-card {
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      cursor: pointer;
      transition: border-color 0.2s ease, transform 0.2s ease, background-color 0.2s ease;
    }
    .blog-card:hover {
      border-color: var(--border-hover);
      background-color: var(--surface-hover);
      transform: translateY(-2px);
    }
    .blog-cover {
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: var(--radius-sm);
      overflow: hidden;
      background-color: var(--surface-thumb);
      margin-bottom: 4px;
    }
    .blog-cover img { width: 100%; height: 100%; object-fit: cover; }
    .blog-meta {
      font-size: 0.78rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    .blog-title {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.28;
    }
    .blog-excerpt {
      font-size: 0.92rem;
      color: var(--text-secondary);
      line-height: 1.6;
      flex-grow: 1;
    }
    .reader-backdrop {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(0, 0, 0, 0.82);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .reader-backdrop.open { display: flex; }
    .reader-sheet {
      width: 100%;
      max-width: 780px;
      max-height: 90vh;
      overflow-y: auto;
      background-color: var(--surface);
      border: 1px solid var(--border-hover);
      border-radius: var(--radius-lg);
      padding: clamp(24px, 4vw, 44px);
      transition: max-width 0.2s ease;
    }
    @media (min-width: 900px) {
      .reader-sheet.has-toc {
        max-width: 1040px;
      }
      .reader-sheet .prose-layout.has-toc .prose-aside {
        top: 16px;
      }
    }
    .reader-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }
    .reader-head h2 {
      font-size: clamp(1.5rem, 3vw, 2.1rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.15;
    }
    @media (max-width: 760px) {
      .blog-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container nav-inner">
      <a href="/" class="brand" aria-label="agustinst.code inicio">
        <span class="brand-avatar"><img src="imag/IMG_0259.PNG" alt="agustinst.code"></span>
        <span><span class="brand-name">agustinst</span><span class="brand-accent">.code</span></span>
      </a>
      <button class="nav-toggle" id="nav-toggle" aria-label="Abrir menú" aria-expanded="false">&#9776;</button>
      <nav class="nav-links" id="nav-links">
        <a href="/" class="nav-link">Inicio</a>
        <a href="/proyect.html" class="nav-link">Proyectos</a>
        <a href="/#sobre-mi" class="nav-link">Sobre mí</a>
        <a href="/#contacto" class="btn btn-accent btn-sm">Contacto</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero" style="padding-bottom: 32px;">
      <div class="container">
        <span class="eyebrow">NOTAS &amp; ARTÍCULOS</span>
        <h1 class="hero-title" style="font-size: clamp(2.1rem, 5vw, 3.6rem);">Blog<span class="accent">.</span></h1>
        <p class="hero-subtitle" style="margin-bottom: 0;">Ideas sobre desarrollo de software, diseño UX/UI y automatización de procesos.</p>
      </div>
    </section>

    <section class="section" style="padding-top: 24px;">
      <div class="container">
        <div id="blog-grid" class="blog-grid">
          <p style="color: var(--text-secondary);">Cargando artículos…</p>
        </div>
      </div>
    </section>
  </main>

  <!-- Reader Modal -->
  <div id="reader-modal" class="reader-backdrop" onclick="if(event.target===this)closeReader()">
    <article class="reader-sheet" id="reader-sheet">
      <div class="reader-progress-track" aria-hidden="true"><div class="reader-progress-fill" id="reader-progress-fill"></div></div>
      <div class="reader-head">
        <div>
          <div id="reader-meta" class="blog-meta" style="margin-bottom: 10px;"></div>
          <h2 id="reader-title"></h2>
        </div>
        <button type="button" class="brand-works-close" onclick="closeReader()" aria-label="Cerrar">&times;</button>
      </div>
      <div id="reader-cover" style="margin-bottom: 22px; display:none;"></div>
      <div id="reader-layout" class="prose-layout">
        <div class="prose-main">
          <div id="reader-tldr"></div>
          <div id="reader-body" class="prose"></div>
        </div>
        <aside id="reader-toc" class="prose-aside"></aside>
      </div>
    </article>
  </div>

  <footer class="site-footer">
    <div class="container footer-inner">
      <span>Copyright &copy; 2025 &middot; Agustín M. Stoppello</span>
      <div class="footer-links">
        <a href="/">agustinst.code</a>
        <span>&middot;</span>
        <a href="https://www.linkedin.com/in/agustinmaximilianostoppello/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
        <span>&middot;</span>
        <a href="https://github.com/Agustinstpp" target="_blank" rel="noopener noreferrer">GitHub</a>
        <span>&middot;</span>
        <a href="https://x.com/agustinst_code" target="_blank" rel="noopener noreferrer">X</a>
      </div>
    </div>
  </footer>

  <script src="js/hacker-loader.js"></script>
  <script src="js/markdown.js"></script>
  <script>
    const navToggle = document.getElementById('nav-toggle');
    const navLinks = document.getElementById('nav-links');
    if (navToggle && navLinks) {
      navToggle.addEventListener('click', () => {
        const isOpen = navLinks.classList.toggle('open');
        navToggle.setAttribute('aria-expanded', String(isOpen));
      });
    }

    let postsCache = [];
    let cleanupReaderSpy = null;

    function esc(t) {
      const d = document.createElement('div');
      d.textContent = t || '';
      return d.innerHTML;
    }

    function openReader(id) {
      const post = postsCache.find((p) => p.id === id);
      if (!post) return;
      if (cleanupReaderSpy) {
        cleanupReaderSpy();
        cleanupReaderSpy = null;
      }
      const rt = window.readingTime(post.content);
      const dateStr = new Date(post.created_at).toLocaleDateString('es-AR', { year: 'numeric', month: 'long', day: 'numeric' });
      document.getElementById('reader-meta').textContent = `${post.author || 'Agustín Stoppello'} · ${dateStr} · ${rt.mins} min de lectura`;
      document.getElementById('reader-title').textContent = post.title;
      const coverEl = document.getElementById('reader-cover');
      if (post.cover_url) {
        coverEl.style.display = '';
        coverEl.innerHTML = `<div class="blog-cover"><img src="${esc(post.cover_url)}" alt=""></div>`;
      } else {
        coverEl.style.display = 'none';
      }
      document.getElementById('reader-tldr').innerHTML = post.summary
        ? `<div class="prose-tldr"><span class="prose-tldr-label">RESUMEN RÁPIDO</span><p>${esc(post.summary)}</p></div>`
        : '';
      const tocHtml = window.renderToc(post.content);
      const hasToc = Boolean(tocHtml);
      const sheet = document.getElementById('reader-sheet');
      const layout = document.getElementById('reader-layout');
      const tocEl = document.getElementById('reader-toc');
      const bodyEl = document.getElementById('reader-body');
      tocEl.innerHTML = tocHtml;
      bodyEl.innerHTML = window.renderMarkdown(post.content);
      if (sheet) sheet.classList.toggle('has-toc', hasToc);
      if (layout) layout.classList.toggle('has-toc', hasToc);
      const fill = document.getElementById('reader-progress-fill');
      if (sheet) sheet.scrollTop = 0;
      if (fill) fill.style.width = '0%';
      document.getElementById('reader-modal').classList.add('open');
      document.body.style.overflow = 'hidden';
      if (hasToc && window.initTocScrollSpy) {
        requestAnimationFrame(() => {
          cleanupReaderSpy = window.initTocScrollSpy(tocEl, bodyEl, sheet);
        });
      }
    }

    const readerSheet = document.getElementById('reader-sheet');
    if (readerSheet) {
      readerSheet.addEventListener('scroll', () => {
        const fill = document.getElementById('reader-progress-fill');
        if (!fill) return;
        const max = readerSheet.scrollHeight - readerSheet.clientHeight;
        fill.style.width = max > 0 ? `${Math.min(100, (readerSheet.scrollTop / max) * 100)}%` : '0%';
      }, { passive: true });
    }

    function closeReader() {
      if (cleanupReaderSpy) {
        cleanupReaderSpy();
        cleanupReaderSpy = null;
      }
      document.getElementById('reader-modal').classList.remove('open');
      document.body.style.overflow = '';
    }

    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeReader(); });

    async function loadBlog() {
      const grid = document.getElementById('blog-grid');
      try {
        const res = await fetch('/api/get-posts');
        const data = await res.json();
        postsCache = data.posts || [];
        if (!postsCache.length) {
          grid.innerHTML = `
            <div class="empty-state-card">
              <span class="empty-state-eyebrow">PRÓXIMAMENTE</span>
              <h3>Próximamente nuevos artículos</h3>
              <p>Estoy redactando nuevas notas sobre desarrollo de software, UX/UI y automatización. ¡Volvé pronto!</p>
            </div>`;
          return;
        }
        grid.innerHTML = postsCache.map((p) => {
          const rt = window.readingTime(p.content);
          const dateStr = new Date(p.created_at).toLocaleDateString('es-AR');
          const excerpt = p.summary || (p.content || '').replace(/[#*`>_[\]()]/g, '').slice(0, 150) + '…';
          const tagsHtml = (p.tags || []).map((t) => `<span class="cert-tag">${esc(t)}</span>`).join('');
          return `
            <article class="blog-card" onclick="openReader(${p.id})">
              ${p.cover_url ? `<div class="blog-cover"><img src="${esc(p.cover_url)}" alt="${esc(p.title)}" loading="lazy"></div>` : ''}
              <div class="blog-meta">
                <span>${esc(p.author || 'Agustín Stoppello')}</span>
                <span>&middot;</span>
                <span>${dateStr}</span>
                <span>&middot;</span>
                <span>${rt.mins} min</span>
              </div>
              <h2 class="blog-title">${esc(p.title)}</h2>
              <p class="blog-excerpt">${esc(excerpt)}</p>
              ${tagsHtml ? `<div class="cert-tags">${tagsHtml}</div>` : ''}
              <span class="project-link-hint">Leer artículo &rarr;</span>
            </article>
          `;
        }).join('');
      } catch {
        grid.innerHTML = '<p style="color:var(--text-secondary);">No se pudieron cargar los artículos.</p>';
      }
    }

    document.addEventListener('DOMContentLoaded', loadBlog);
  </script>
</body>
</html>
